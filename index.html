<!DOCTYPE html>
<html>
<head>
<title>My Tiguan Dream</title>
<style>
body { background-color: #111111; color: white; font-family: Arial; text-align: center; padding: 40px; }
h1 { color: #ff9900; font-size: 50px; }
.box { background-color: #222222; padding: 30px; border-radius: 20px; border: 2px solid #ff9900; max-width: 600px; margin: auto; }
button { background-color: #ff9900; color: black; padding: 15px 30px; font-size: 20px; font-weight: bold; border: none; border-radius: 10px; margin: 5px; cursor: pointer; }
.color-btn { padding: 10px 20px; font-size: 16px; }
.car-box { position: relative; width: 100%; margin-top: 20px; }
.car-box img { width: 100%; border-radius: 15px; display: block; }
#colorLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 15px; background: transparent; mix-blend-mode: color; pointer-events: none; }
</style>
</head>
<body>
<div class="box">

<p><b>I will not stop.</b></p>
<br>
<button>My Dream Car</button>
<br><br>
<p><b>Choose your color:</b></p>
<button class="color-btn" style="background:white; color:black;" onclick="document.getElementById('colorLayer').style.background='transparent'">White</button>
<button class="color-btn" style="background:black; color:white;" onclick="document.getElementById('colorLayer').style.background='rgba(0,0,0,0.7)'">Black</button>
<button class="color-btn" style="background:blue; color:white;" onclick="document.getElementById('colorLayer').style.background='rgba(0,80,255,0.8)'">Blue</button>

</body>
</html>
