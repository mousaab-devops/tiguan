<!DOCTYPE html>
<html>
<head>
<title>My Tiguan Dream</title>
<style>
body { background-color: #111111; color: white; font-family: Arial; text-align: center; padding: 40px; }
h1 { color: #ff9900; font-size: 50px; }
.box { background-color: #222222; padding: 30px; border-radius: 20px; border: 2px solid #ff9900; max-width: 600px; margin: auto; }
button { background-color: #ff9900; color: black; padding: 15px 30px; font-size: 20px; font-weight: bold; border: none; border-radius: 10px; margin: 5px; cursor: pointer; }
.color-btn { padding: 10px 20px; font-size: 16px; }
img { width: 100%; border-radius: 15px; margin-top: 20px; transition: 0.5s; }
</style>
</head>
<body>
<div class="box">
<h1>My Tiguan Dream</h1>
<p>Hi, I'm <b>Mousaab</b> from <b>ALGERIA</b>.</p>
<p>I'm learning programming and developing my skills.</p>
<p>My goal: Buy my Tiguan with my own work.</p>
<p><b>I will not stop.</b></p>
<br>
<button>My Dream Car</button>
<br><br>
<p><b>Choose your color:</b></p>
<button class="color-btn" style="background:white; color:black;" onclick="document.getElementById('mycar').style.filter='none'">White</button>
<button class="color-btn" style="background:black; color:white;" onclick="document.getElementById('mycar').style.filter='grayscale(1) brightness(0.35)'">Black</button>
<button class="color-btn" style="background:blue; color:white;" onclick="document.getElementById('mycar').style.filter='hue-rotate(190deg) saturate(2)'">Blue</button>
<button class="color-btn" style="background:red; color:white;" onclick="document.getElementById('mycar').style.filter='hue-rotate(-50deg) saturate(3)'">Red</button>
<br>
<img id="mycar" src="https://commons.wikimedia.org/wiki/Special:FilePath/VW_Tiguan_Allspace_R-Line_2.0_TDI_4Motion_(II,_Facelift)_–_f_10072022.jpg">
<p><b>VOLKSWAGEN TIGUAN R-LINE</b></p>
</div>
</body>
</html>
